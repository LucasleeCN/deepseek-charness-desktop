<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek Harness Desktop</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "Segoe UI Variable", "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #f6f7f9;
        color: #172033;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; overflow: hidden; }

      /* ---- custom title bar (42px) ---- */
      .titlebar {
        display: flex;
        align-items: center;
        height: 42px;
        padding-left: 14px;
        background: #eef0f4;
        border-bottom: 1px solid #d9dde6;
        user-select: none;
        -webkit-app-region: drag;
      }
      .titlebar__label {
        flex: 1;
        min-width: 0;
        font-size: 12.5px;
        color: #4a5568;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .titlebar__controls {
        display: flex;
        height: 100%;
        -webkit-app-region: no-drag;
      }
      .titlebar__button {
        width: 46px;
        height: 100%;
        border: none;
        background: transparent;
        font-size: 13px;
        line-height: 1;
        color: #4a5568;
        cursor: default;
      }
      .titlebar__button:hover { background: #dde1e9; }
      .titlebar__button--remote { width: 56px; font-size: 12px; }
      .titlebar__button--remote.is-on { color: #4d6bfe; }
      .titlebar__button--close:hover { background: #e81123; color: #ffffff; }

      /* ---- startup view ---- */
      .startup {
        position: absolute;
        inset: 42px 0 0 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f6f7f9;
        color: #172033;
      }
      .startup__spinner {
        width: 34px;
        height: 34px;
        border: 3px solid #d9dde6;
        border-top-color: #4d6bfe;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      .startup__text { font-size: 14px; color: #4a5568; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <!-- Trusted shell chrome: the official UI is attached as a separate
         sandboxed WebContentsView below this 42px bar. -->
    <header class="titlebar">
      <span class="titlebar__label" id="pageTitle">正在准备本地服务…</span>
      <div class="titlebar__controls">
        <button class="titlebar__button" id="minimize" title="最小化" aria-label="最小化">—</button>
        <button class="titlebar__button" id="maximize" title="最大化/还原" aria-label="最大化/还原">□</button>
        <button class="titlebar__button titlebar__button--remote" id="remote" title="手机远程访问" aria-label="手机远程访问">手机</button>
        <button class="titlebar__button titlebar__button--close" id="close" title="关闭" aria-label="关闭">✕</button>
      </div>
    </header>

    <div class="startup" id="startupView">
      <div class="startup__spinner"></div>
      <div class="startup__text">正在启动本地 Harness 服务与工作区环境，请稍候…</div>
    </div>

    <script>
      'use strict'
      const win = window.desktopWindow
      if (!win) {
        throw new Error('desktopWindow bridge missing: preload did not load')
      }

      // Window controls
      document.getElementById('minimize').addEventListener('click', () => win.minimize())
      document.getElementById('maximize').addEventListener('click', () => win.toggleMaximize())
      document.getElementById('close').addEventListener('click', () => win.close())
      document.getElementById('remote').addEventListener('click', () => win.openRemote())

      // Reflect the phone remote-access mode in the title-bar button.
      const remoteButton = document.getElementById('remote')
      const remoteBridge = window.desktopRemote
      if (remoteBridge) {
        remoteBridge.onStateChange(state => {
          remoteButton.classList.toggle('is-on', Boolean(state.enabled))
          remoteButton.title = state.enabled
            ? `手机远程访问已开启（端口 ${state.port}）`
            : '手机远程访问'
        })
        void remoteBridge.getState().then(state => {
          remoteButton.classList.toggle('is-on', Boolean(state.enabled))
          remoteButton.title = state.enabled
            ? `手机远程访问已开启（端口 ${state.port}）`
            : '手机远程访问'
        }).catch(() => {})
      }

      // Keep the maximize button glyph in sync with the actual window state.
      const maximizeButton = document.getElementById('maximize')
      win.onStateChange(({ maximized }) => {
        maximizeButton.textContent = maximized ? '❐' : '□'
        maximizeButton.title = maximized ? '还原' : '最大化'
      })

      // Mirror the harness page title (sent by the main process).
      win.onPageTitle(title => {
        document.getElementById('pageTitle').textContent = title || 'DeepSeek Harness'
        document.title = title || 'DeepSeek Harness Desktop'
      })

      // Initial state sync.
      void win.getState().then(state => {
        maximizeButton.textContent = state.maximized ? '❐' : '□'
        maximizeButton.title = state.maximized ? '还原' : '最大化'
      })

      // When the harness view replaces the startup screen, hide it. The main
      // process hides it implicitly because the view covers the area; this is
      // a visual safety net for the startup text lingering behind it.
      window.addEventListener('resize', () => {
        document.getElementById('startupView').classList.add('hidden')
      })
    </script>
  </body>
</html>
